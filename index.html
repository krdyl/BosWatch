<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOS Field Tracker</title>
<style>
:root {
  --bg: #f4f3ef;
  --surface: #ffffff;
  --surface2: #eeede8;
  --border: #dddbd3;
  --border2: #c8c5bc;
  --text: #2a2a26;
  --muted: #7a7870;
  --muted2: #a8a89e;
  --green: #3a7a3a;
  --green-dim: #e8f3e8;
  --green-text: #2d6b2d;
  --red: #a03030;
  --red-dim: #fce8e8;
  --red-text: #8b2020;
  --amber: #8a6010;
  --amber-dim: #fef5e0;
  --amber-text: #7a5000;
  --blue: #2a5a8a;
  --blue-dim: #e8f0f8;
  --blue-text: #1a4a7a;
  --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; overscroll-behavior: none; }

/* HEADER */
.app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.app-title { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); }
.app-title span { color: var(--green-text); }
.header-right { display: flex; align-items: center; gap: 10px; }
.operator-badge { font-family: var(--mono); font-size: 10px; color: var(--amber-text); background: var(--amber-dim); border: 1px solid var(--amber); padding: 2px 8px; border-radius: 3px; cursor: pointer; }
.header-date { font-family: var(--mono); font-size: 10px; color: var(--muted); }

/* TABS */
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 10px 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border: none; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab-btn.active { color: var(--green-text); border-bottom-color: var(--green-text); }

/* VIEWS */
.view { display: none; }
.view.active { display: block; }

/* START SCREEN */
.start-screen { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
.start-logo { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--green-text); letter-spacing: 0.08em; margin-bottom: 4px; }
.start-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 32px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.form-input { width: 100%; padding: 10px 12px; font-family: var(--sans); font-size: 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); }
.form-input:focus { outline: 1px solid var(--green); }
.in-progress-banner { background: var(--amber-dim); border: 1px solid var(--amber); border-radius: var(--r); padding: 14px; margin-bottom: 20px; }
.banner-title { font-family: var(--mono); font-size: 11px; color: var(--amber-text); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.banner-detail { font-size: 13px; color: var(--text); margin-bottom: 12px; line-height: 1.6; }
.banner-actions { display: flex; gap: 8px; }
.btn-continue { flex: 1; padding: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); border-radius: var(--r); cursor: pointer; }
.btn-discard { flex: 1; padding: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: none; color: var(--red-text); border: 1px solid var(--red); border-radius: var(--r); cursor: pointer; }
.incognito-warning { background: var(--red-dim); border: 1px solid var(--red); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; font-family: var(--mono); font-size: 11px; color: var(--red-text); }
.checkpoint-zone { border: 1px dashed var(--border2); border-radius: var(--r); padding: 14px; text-align: center; margin-bottom: 16px; }
.checkpoint-zone p { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.btn-load-checkpoint { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); border-radius: var(--r); cursor: pointer; }
.btn-start { width: 100%; padding: 14px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); border-radius: var(--r); cursor: pointer; margin-top: 8px; }

/* VISIT HEADER */
.visit-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; }
.visit-progress { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.progress-label { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.progress-track { flex: 1; height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green-text); border-radius: 2px; transition: width 0.4s ease; }
.station-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.station-dot { width: 52px; height: 52px; border-radius: var(--r); border: 1px solid var(--border2); background: var(--surface2); font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; flex-direction: column; line-height: 1.3; text-align: center; padding: 4px; font-weight: 600; }
.station-dot.current { border-color: var(--green-text); color: var(--green-text); background: var(--green-dim); }
.station-dot.done { border-color: var(--green); background: var(--green-dim); color: var(--green-text); }
.station-dot.flagged { border-color: var(--amber); background: var(--amber-dim); color: var(--amber-text); }

/* STATION */
.station-view { padding: 14px 16px; }
.station-title { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.station-name { font-family: var(--mono); font-size: 20px; font-weight: 600; color: var(--text); }
.station-site { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
.station-timestamp { font-family: var(--mono); font-size: 10px; color: var(--green-text); text-align: right; }

/* SENSOR SECTION */
.sensor-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 10px; overflow: hidden; }
.sensor-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.sensor-label { display: flex; align-items: center; gap: 8px; }
.sensor-tag { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 3px; text-transform: uppercase; }
.sensor-tag.lf { background: var(--blue-dim); color: var(--blue-text); border: 1px solid var(--blue); }
.sensor-tag.br { background: var(--amber-dim); color: var(--amber-text); border: 1px solid var(--amber); }
.sensor-tag.hb { background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); }
.sensor-tag.sp { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
.sensor-info { display: flex; flex-direction: column; }
.sensor-fullname { font-size: 14px; color: var(--text); }
.sensor-serial-inline { font-family: var(--mono); font-size: 12px; color: var(--amber-text); margin-top: 1px; }
.sensor-right { display: flex; align-items: center; gap: 8px; }
.sensor-progress { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.mark-all-btn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; padding: 6px 10px; background: var(--green-dim); border: 1px solid var(--green); color: var(--green-text); border-radius: 3px; cursor: pointer; white-space: nowrap; }

/* CHECK ITEMS */
.check-item { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.check-item:last-child { border-bottom: none; }
.check-top { display: flex; align-items: center; gap: 8px; }
.check-name { flex: 1; font-size: 15px; color: var(--text); min-width: 100px; }
.check-name.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted2); }
.check-name.flagged { color: var(--amber-text); }
.check-controls { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.chk-btn { height: 40px; min-width: 40px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--border2); background: var(--surface2); color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; font-family: var(--mono); }
.chk-btn.yes { background: var(--green-dim); border-color: var(--green); color: var(--green-text); }
.chk-btn.no { background: var(--red-dim); border-color: var(--red); color: var(--red-text); }
.chk-btn.na { background: var(--amber-dim); border-color: var(--amber); color: var(--amber-text); font-size: 12px; }
.moisture-wrap { display: flex; align-items: center; gap: 6px; }
.moisture-input { width: 72px; height: 40px; padding: 0 8px; font-family: var(--mono); font-size: 15px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); text-align: center; }
.moisture-input:focus { outline: 1px solid var(--green); }
.moisture-input.high { border-color: var(--red); color: var(--red-text); }
.moisture-unit { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.high-warn { font-size: 13px; color: var(--red-text); }
.remark-row { margin-top: 8px; }
.remark-input { width: 100%; padding: 8px 10px; font-family: var(--mono); font-size: 14px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); }
.remark-input:focus { outline: 1px solid var(--muted); }
.add-remark-btn { font-family: var(--mono); font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 2px 0; }

/* STATION ACTIONS */
.station-actions { padding: 14px 16px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.next-btn { padding: 16px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); border-radius: var(--r); cursor: pointer; }
.export-now-btn { padding: 16px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; background: var(--blue-dim); color: var(--blue-text); border: 1px solid var(--blue); border-radius: var(--r); cursor: pointer; }

/* ACK OVERLAY */
.ack-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200; overflow-y: auto; padding: 16px; }
.ack-overlay.open { display: block; }
.ack-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; max-width: 480px; margin: 20px auto; overflow: hidden; }
.ack-header { background: var(--amber-dim); border-bottom: 1px solid var(--amber); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.ack-header h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber-text); flex: 1; }
.ack-close { background: none; border: none; color: var(--amber-text); font-size: 18px; cursor: pointer; }
.ack-body { padding: 16px; }
.ack-intro { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.ack-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
.ack-item.acknowledged { border-color: var(--green); background: var(--green-dim); }
.ack-checkbox { width: 20px; height: 20px; border: 1px solid var(--border2); border-radius: 3px; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; margin-top: 1px; transition: all 0.15s; }
.ack-item.acknowledged .ack-checkbox { background: var(--green-dim); border-color: var(--green); color: var(--green-text); }
.ack-text { font-size: 13px; line-height: 1.5; }
.ack-location { font-family: var(--mono); font-size: 11px; color: var(--amber-text); margin-bottom: 2px; }
.ack-detail { color: var(--muted); font-size: 12px; }
.ack-confirm-btn { width: 100%; margin-top: 14px; padding: 13px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--green-dim); color: var(--green-text); border: 1px solid var(--green); border-radius: var(--r); cursor: pointer; opacity: 0.4; transition: opacity 0.2s; }
.ack-confirm-btn.ready { opacity: 1; }

/* HISTORY */
.history-view { padding: 14px 16px; }
.history-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
select { width: 100%; padding: 8px 10px; font-family: var(--sans); font-size: 13px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); appearance: none; -webkit-appearance: none; }
.new-visit-btn { width: 100%; padding: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); border-radius: var(--r); cursor: pointer; margin-bottom: 10px; }
.visit-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; cursor: pointer; }
.visit-card-head { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.visit-date { font-family: var(--mono); font-size: 12px; color: var(--text); }
.visit-operator { font-family: var(--mono); font-size: 10px; color: var(--amber-text); }
.visit-flags { display: flex; gap: 6px; }
.flag-chip { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 3px; }
.flag-chip.ok { background: var(--green-dim); color: var(--green-text); }
.flag-chip.blank { background: var(--amber-dim); color: var(--amber-text); }
.visit-stations { padding: 8px 14px; display: flex; gap: 4px; flex-wrap: wrap; }
.visit-station-chip { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border2); color: var(--muted); }
.visit-station-chip.done { border-color: var(--green); color: var(--green-text); background: var(--green-dim); }
.visit-station-chip.flagged { border-color: var(--amber); color: var(--amber-text); background: var(--amber-dim); }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; padding: 16px; overflow-y: auto; }
.modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 6px; width: 100%; max-width: 480px; margin-top: 20px; overflow: hidden; }
.modal-head { background: var(--surface2); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); }
.modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
.modal-body { padding: 16px; }
.modal-station-block { margin-bottom: 14px; }
.modal-station-title { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.modal-check-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
.modal-check-row:last-child { border-bottom: none; }
.modal-check-label { color: var(--muted); }
.modal-check-val { font-family: var(--mono); font-size: 11px; }
.modal-check-val.yes { color: var(--green-text); }
.modal-check-val.no { color: var(--red-text); }
.modal-check-val.na { color: var(--amber-text); }
.delete-btn { width: 100%; margin-top: 14px; padding: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: none; border: 1px solid var(--red); color: var(--red-text); border-radius: var(--r); cursor: pointer; }
.empty-state { text-align: center; padding: 48px 16px; color: var(--muted); font-family: var(--mono); font-size: 11px; line-height: 2.5; }

/* CONFIRM DIALOG */
.confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 400; align-items: center; justify-content: center; padding: 16px; }
.confirm-overlay.open { display: flex; }
.confirm-box { background: var(--surface); border: 1px solid var(--red); border-radius: 6px; padding: 20px; max-width: 360px; width: 100%; }
.confirm-title { font-family: var(--mono); font-size: 12px; color: var(--red-text); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.confirm-msg { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
.confirm-input { width: 100%; padding: 10px; font-family: var(--mono); font-size: 14px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); margin-bottom: 12px; text-align: center; letter-spacing: 0.1em; }
.confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.confirm-cancel { padding: 10px; font-family: var(--mono); font-size: 11px; background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: var(--r); cursor: pointer; }
.confirm-ok { padding: 10px; font-family: var(--mono); font-size: 11px; background: var(--red-dim); border: 1px solid var(--red); color: var(--red-text); border-radius: var(--r); cursor: pointer; opacity: 0.4; transition: opacity 0.2s; }
.confirm-ok.ready { opacity: 1; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">BosWatch <span>Field</span> Tracker</div>
  <div class="header-right">
    <span class="operator-badge" id="operator-badge" onclick="editOperator()" style="display:none"></span>
    <span class="header-date" id="header-date"></span>
  </div>
</header>

<div class="tabs" id="main-tabs" style="display:none">
  <button class="tab-btn active" onclick="switchTab('visit')">Visit</button>
  <button class="tab-btn" onclick="switchTab('history')">History</button>
</div>

<!-- START SCREEN -->
<div id="view-start" class="view active">
  <div class="start-screen">
    <div class="start-logo">BosWatch</div>
    <div class="start-sub">Bosland Field Tracker · v2.0</div>

    <div id="incognito-warning" class="incognito-warning" style="display:none">
      ⚠ Private/Incognito mode detected — data will NOT persist when you close this tab.
    </div>

    <div id="in-progress-banner" style="display:none" class="in-progress-banner">
      <div class="banner-title">⚠ Visit in progress</div>
      <div class="banner-detail" id="banner-detail"></div>
      <div class="banner-actions">
        <button class="btn-continue" onclick="continueVisit()">Continue</button>
        <button class="btn-discard" onclick="discardVisit()">Discard</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Operator name</label>
      <input class="form-input" id="operator-input" type="text" placeholder="Your name" autocomplete="name">
    </div>

    <div class="checkpoint-zone">
      <p>Restore from checkpoint file if localStorage was lost</p>
      <button class="btn-load-checkpoint" onclick="document.getElementById('checkpoint-file').click()">Load checkpoint JSON</button>
      <input type="file" id="checkpoint-file" accept=".json" style="display:none" onchange="loadCheckpoint(event)">
    </div>

    <button class="btn-start" onclick="startNewVisit()">Start new visit</button>
  </div>
</div>

<!-- VISIT VIEW -->
<div id="view-visit" class="view">
  <div class="visit-header">
    <div class="visit-progress">
      <span class="progress-label" id="progress-label">0 / 8</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="station-dots" id="station-dots"></div>
  </div>
  <div id="station-area"></div>
</div>

<!-- HISTORY VIEW -->
<div id="view-history" class="view">
  <div class="history-view">
    <button class="new-visit-btn" onclick="confirmNewVisit()">+ New visit</button>
    <div class="history-filters">
      <select id="filter-site" onchange="renderHistory()">
        <option value="">All sites</option>
        <option>BOS001</option><option>BOS002</option><option>BOS003</option><option>BOS004</option>
      </select>
      <select id="filter-sensor" onchange="renderHistory()">
        <option value="">All sensors</option>
        <option>LF</option><option>BR</option><option>HB</option>
      </select>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<!-- ACK OVERLAY -->
<div class="ack-overlay" id="ack-overlay">
  <div class="ack-box">
    <div class="ack-header">
      <span style="font-size:16px">⚠</span>
      <h3 id="ack-title">Incomplete items</h3>
      <button class="ack-close" onclick="closeAck()">×</button>
    </div>
    <div class="ack-body">
      <p class="ack-intro" id="ack-intro"></p>
      <div id="ack-items"></div>
      <button class="ack-confirm-btn" id="ack-confirm-btn" onclick="confirmAck()">Acknowledge all &amp; continue</button>
    </div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box"></div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title">Confirm action</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <input class="confirm-input" id="confirm-input" placeholder='Type "CONFIRM"' oninput="onConfirmInput()">
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-ok" id="confirm-ok-btn" onclick="doConfirm()">Proceed</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const STATIONS = [
  { site:'BOS001', loc:'D08', lf:'332',  hb:'21782601' },
  { site:'BOS001', loc:'H04', lf:'331',  hb:'21782603' },
  { site:'BOS002', loc:'D04', lf:'334',  hb:'21782593' },
  { site:'BOS002', loc:'H08', lf:'333',  hb:'21782606' },
  { site:'BOS003', loc:'D06', lf:'329',  hb:'21782605' },
  { site:'BOS003', loc:'H06', lf:'330',  hb:'21782592' },
  { site:'BOS004', loc:'B04', lf:'328',  hb:'21785491' },
  { site:'BOS004', loc:'H04', lf:'327',  hb:'21782604' },
];

const SENSOR_CHECKS = {
  LF: [
    { id:'lf_pic_sensor', label:'Pic of leaf sensor',            type:'check' },
    { id:'lf_pic_pre',    label:'Pic of sensor head (pre-clean)',type:'check' },
    { id:'lf_clean',      label:'Clean sensor head',             type:'check' },
    { id:'lf_pic_post',   label:'Pic of sensor head (post-clean)',type:'check' },
    { id:'lf_data',       label:'Data download',                 type:'check' },
    { id:'lf_moisture',   label:'Moisture %',                    type:'moisture' },
    { id:'lf_desiccant',  label:'Desiccant pod replaced',        type:'check' },
    { id:'lf_panel_pic',  label:'Pic of computer panel',         type:'check' },
    { id:'lf_lid',        label:'Closed lid',                    type:'check' },
  ],
  BR: [
    { id:'br_battery',    label:'Battery replaced',              type:'check' },
    { id:'br_data',       label:'Data download',                 type:'check' },
  ],
  HB: [
    { id:'hb_data',       label:'Data download',                 type:'check' },
  ],
  SP: [
    { id:'sp_inspect',    label:'Inspect solar panel',           type:'check' },
  ],
};

const SENSOR_ORDER = ['LF','BR','HB','SP'];
const SENSOR_NAMES = { LF:'Leaf', BR:'Brinno', HB:'Hobo', SP:'Solar Panel' };

// ── STATE ─────────────────────────────────────────────────────────────────────
let visits = [];
let currentVisit = null;
let currentStationIdx = 0;
let operatorName = '';
let ackCallback = null;
let ackItems = [];
let confirmCallback = null;

function loadState() {
  try { visits = JSON.parse(localStorage.getItem('bos_visits') || '[]'); } catch(e) { visits = []; }
  try { currentVisit = JSON.parse(localStorage.getItem('bos_current') || 'null'); } catch(e) { currentVisit = null; }
  try { currentStationIdx = parseInt(localStorage.getItem('bos_station_idx') || '0'); } catch(e) { currentStationIdx = 0; }
  try { operatorName = localStorage.getItem('bos_operator') || ''; } catch(e) { operatorName = ''; }
}

function saveState() {
  try {
    localStorage.setItem('bos_visits', JSON.stringify(visits));
    localStorage.setItem('bos_current', JSON.stringify(currentVisit));
    localStorage.setItem('bos_station_idx', String(currentStationIdx));
    localStorage.setItem('bos_operator', operatorName);
  } catch(e) { console.warn('localStorage save failed', e); }
}

function isIncognito() {
  try { localStorage.setItem('_test','1'); localStorage.removeItem('_test'); return false; }
  catch(e) { return true; }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  const d = new Date();
  document.getElementById('header-date').textContent =
    d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});

  loadState();

  if (isIncognito()) {
    document.getElementById('incognito-warning').style.display = 'block';
  }

  if (operatorName) {
    document.getElementById('operator-input').value = operatorName;
  }

  if (currentVisit) {
    const done = currentVisit.stations.filter(s => s.stationDate).length;
    const startDate = currentVisit.startDate || '?';
    const op = currentVisit.operator || '?';
    document.getElementById('banner-detail').textContent =
      `${done}/8 stations completed · Started ${startDate} · Operator: ${op}`;
    document.getElementById('in-progress-banner').style.display = 'block';
  }
}

// ── OPERATOR ──────────────────────────────────────────────────────────────────
function editOperator() {
  switchTab('start');
}

function updateOperatorBadge() {
  const badge = document.getElementById('operator-badge');
  if (operatorName) {
    badge.textContent = operatorName;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

// ── START / CONTINUE ──────────────────────────────────────────────────────────
function continueVisit() {
  const op = document.getElementById('operator-input').value.trim();
  if (op) { operatorName = op; saveState(); }
  updateOperatorBadge();
  document.getElementById('main-tabs').style.display = 'flex';
  switchTab('visit');
  renderStationDots();
  renderStation(currentStationIdx);
}

function discardVisit() {
  showConfirm(
    'Discard visit',
    'This will permanently discard all in-progress visit data. This cannot be undone.',
    () => {
      currentVisit = null;
      currentStationIdx = 0;
      saveState();
      document.getElementById('in-progress-banner').style.display = 'none';
    }
  );
}

function startNewVisit() {
  const op = document.getElementById('operator-input').value.trim();
  if (!op) { alert('Please enter your operator name before starting.'); return; }
  operatorName = op;

  if (currentVisit) {
    showConfirm(
      'Start new visit',
      'There is already a visit in progress. Starting a new one will discard all current data.',
      doStartNew
    );
  } else {
    doStartNew();
  }
}

function doStartNew() {
  const now = new Date();
  currentVisit = {
    operator: operatorName,
    startDate: now.toLocaleDateString('en-GB'),
    exportDate: null,
    stations: STATIONS.map(s => ({
      site: s.site, loc: s.loc,
      lf_serial: s.lf, hb_serial: s.hb,
      stationDate: null, stationTime: null,
      checks: {}
    }))
  };
  currentStationIdx = 0;
  saveState();
  updateOperatorBadge();
  document.getElementById('main-tabs').style.display = 'flex';
  document.getElementById('in-progress-banner').style.display = 'none';
  switchTab('visit');
  renderStationDots();
  renderStation(0);
}

function confirmNewVisit() {
  if (currentVisit) {
    showConfirm('Start new visit', 'Discard current in-progress visit and start fresh?', doStartNew);
  } else {
    switchTab('start');
  }
}

// ── STATION DOTS ──────────────────────────────────────────────────────────────
function renderStationDots() {
  const container = document.getElementById('station-dots');
  const done = currentVisit.stations.filter(s => s.stationDate).length;
  document.getElementById('progress-label').textContent = `${done} / 8`;
  document.getElementById('progress-fill').style.width = `${done/8*100}%`;

  container.innerHTML = STATIONS.map((s, i) => {
    const st = currentVisit.stations[i];
    const isDone = !!st.stationDate;
    const isCurrent = i === currentStationIdx;
    const hasBlanks = isDone && getStationBlanks(i).length > 0;
    let cls = 'station-dot';
    if (isCurrent) cls += ' current';
    else if (hasBlanks) cls += ' flagged';
    else if (isDone) cls += ' done';
    return `<div class="${cls}" onclick="jumpToStation(${i})">
      <span>${s.site.slice(-3)}</span>
      <span>${s.loc}</span>
    </div>`;
  }).join('');
}

function jumpToStation(i) {
  currentStationIdx = i;
  saveState();
  renderStationDots();
  renderStation(i);
}

// ── STATION RENDER ────────────────────────────────────────────────────────────
function renderStation(idx) {
  const s = STATIONS[idx];
  const st = currentVisit.stations[idx];
  const area = document.getElementById('station-area');

  let html = `<div class="station-view">
    <div class="station-title">
      <div>
        <div class="station-name">${s.loc}</div>
        <div class="station-site">${s.site}</div>
      </div>
      <div class="station-timestamp">
        ${st.stationDate ? `✓ ${st.stationDate}<br>${st.stationTime}` : ''}
      </div>
    </div>`;

  SENSOR_ORDER.forEach(sensor => {
    const checks = SENSOR_CHECKS[sensor];
    const serial = sensor === 'LF' ? s.lf : sensor === 'HB' ? s.hb : null;
    const done = checks.filter(c => {
      const v = st.checks[c.id];
      return v !== undefined && v !== '';
    }).length;

    html += `<div class="sensor-section">
      <div class="sensor-header">
        <div class="sensor-label">
          <span class="sensor-tag ${sensor.toLowerCase()}">${sensor}</span>
          <div class="sensor-info">
            <span class="sensor-fullname">${SENSOR_NAMES[sensor]}</span>
            ${serial ? `<span class="sensor-serial-inline">S/N: ${serial}</span>` : ''}
          </div>
        </div>
        <div class="sensor-right">
          <span class="sensor-progress">${done}/${checks.length}</span>
          <button class="mark-all-btn" onclick="markAllYes(${idx},'${sensor}')">✓ All</button>
        </div>
      </div>
      <div class="sensor-body">`;

    checks.forEach(c => {
      const val = st.checks[c.id] !== undefined ? st.checks[c.id] : '';
      const remark = st.checks[c.id + '_remark'] || '';
      const hasRemark = remark.length > 0;

      if (c.type === 'moisture') {
        const mval = st.checks[c.id] || '';
        const isHigh = mval !== '' && parseFloat(mval) >= 40;
        html += `<div class="check-item">
          <div class="check-top">
            <span class="check-name${mval ? ' done' : ''}">${c.label}</span>
            <div class="check-controls">
              <div class="moisture-wrap">
                <input class="moisture-input${isHigh?' high':''}" type="number" min="0" max="100"
                  placeholder="—" value="${mval}"
                  onchange="setMoisture(${idx},'${c.id}',this.value)">
                <span class="moisture-unit">%</span>
                ${isHigh ? `<span class="high-warn">⚠ HIGH</span>` : ''}
              </div>
              <button class="chk-btn na${val==='na'?' na':''}" onclick="setCheck(${idx},'${c.id}','na')">N/A</button>
            </div>
          </div>
          <div class="remark-row">
            ${hasRemark
              ? `<input class="remark-input" placeholder="Remark…" value="${remark}" onchange="setRemark(${idx},'${c.id}',this.value)">`
              : `<button class="add-remark-btn" onclick="addRemark(this,${idx},'${c.id}')">+ remark</button>`}
          </div>
        </div>`;
      } else {
        html += `<div class="check-item">
          <div class="check-top">
            <span class="check-name${val==='yes'?' done':val==='na'?' flagged':''}">${c.label}</span>
            <div class="check-controls">
              <button class="chk-btn${val==='yes'?' yes':''}" onclick="setCheck(${idx},'${c.id}','yes')">✓</button>
              <button class="chk-btn${val==='no'?' no':''}" onclick="setCheck(${idx},'${c.id}','no')">✗</button>
              <button class="chk-btn na${val==='na'?' na':''}" onclick="setCheck(${idx},'${c.id}','na')">N/A</button>
            </div>
          </div>
          <div class="remark-row">
            ${hasRemark
              ? `<input class="remark-input" placeholder="Remark…" value="${remark}" onchange="setRemark(${idx},'${c.id}',this.value)">`
              : `<button class="add-remark-btn" onclick="addRemark(this,${idx},'${c.id}')">+ remark</button>`}
          </div>
        </div>`;
      }
    });

    html += `</div></div>`;
  });

  const isLast = idx === 7;
  html += `<div class="station-actions">
    <button class="next-btn" onclick="${isLast ? 'advanceStation(7)' : `advanceStation(${idx})`}">
      ${isLast ? 'Done &amp; next →' : 'Next station →'}
    </button>
    <button class="export-now-btn" onclick="triggerExport()">↓ Export CSV</button>
  </div></div>`;

  area.innerHTML = html;
}

// ── CHECK SETTERS (no scroll) ─────────────────────────────────────────────────
function setCheck(stIdx, id, val) {
  const st = currentVisit.stations[stIdx];
  const prev = st.checks[id];
  st.checks[id] = prev === val ? '' : val;
  saveState();
  updateCheckItem(stIdx, id);
  updateSensorProgress(stIdx);
  renderStationDots();
}

function updateCheckItem(stIdx, id) {
  const st = currentVisit.stations[stIdx];
  const val = st.checks[id] || '';
  // Update button states
  const btns = document.querySelectorAll(`[onclick*="'${id}'"]`);
  btns.forEach(btn => {
    const txt = btn.textContent.trim();
    btn.className = btn.className.replace(/ (yes|no|na)\b/g, '');
    if (txt === '✓' && val === 'yes') btn.classList.add('yes');
    if (txt === '✗' && val === 'no') btn.classList.add('no');
    if (txt === 'N/A' && val === 'na') btn.classList.add('na');
  });
  // Update label
  const item = document.querySelector(`[onclick*="setCheck(${stIdx},'${id}'"]`)?.closest('.check-item');
  if (item) {
    const label = item.querySelector('.check-name');
    if (label) {
      label.className = 'check-name';
      if (val === 'yes') label.classList.add('done');
      if (val === 'na') label.classList.add('flagged');
    }
  }
}

function updateSensorProgress(stIdx) {
  // Re-render just the progress counters without touching the whole DOM
  const st = currentVisit.stations[stIdx];
  SENSOR_ORDER.forEach(sensor => {
    const checks = SENSOR_CHECKS[sensor];
    const done = checks.filter(c => {
      const v = st.checks[c.id];
      return v !== undefined && v !== '';
    }).length;
    // Find progress span by sensor section — use sensor tag text
    const tags = document.querySelectorAll('.sensor-tag');
    tags.forEach(tag => {
      if (tag.textContent.trim() === sensor) {
        const prog = tag.closest('.sensor-section')?.querySelector('.sensor-progress');
        if (prog) prog.textContent = `${done}/${checks.length}`;
      }
    });
  });
}

function setMoisture(stIdx, id, val) {
  currentVisit.stations[stIdx].checks[id] = val;
  saveState();
  const input = document.querySelector('.moisture-input');
  if (input) {
    const isHigh = val !== '' && parseFloat(val) >= 40;
    input.classList.toggle('high', isHigh);
    const warn = input.parentElement?.querySelector('.high-warn');
    if (isHigh && !warn) {
      const span = document.createElement('span');
      span.className = 'high-warn';
      span.textContent = '⚠ HIGH';
      input.parentElement.appendChild(span);
    } else if (!isHigh && warn) {
      warn.remove();
    }
  }
  updateSensorProgress(stIdx);
  renderStationDots();
}

function setRemark(stIdx, id, val) {
  currentVisit.stations[stIdx].checks[id + '_remark'] = val;
  saveState();
}

function addRemark(btn, stIdx, id) {
  const row = btn.parentElement;
  row.innerHTML = `<input class="remark-input" placeholder="Remark…" value="" onchange="setRemark(${stIdx},'${id}',this.value)">`;
  row.querySelector('input').focus();
}

function markAllYes(stIdx, sensor) {
  const st = currentVisit.stations[stIdx];
  SENSOR_CHECKS[sensor].forEach(c => {
    if (c.type !== 'moisture') st.checks[c.id] = 'yes';
  });
  saveState();
  renderStation(stIdx);
  renderStationDots();
}

// ── BLANK DETECTION ───────────────────────────────────────────────────────────
function getStationBlanks(stIdx) {
  const st = currentVisit.stations[stIdx];
  const blanks = [];
  SENSOR_ORDER.forEach(sensor => {
    SENSOR_CHECKS[sensor].forEach(c => {
      const val = st.checks[c.id];
      if (val === undefined || val === '') blanks.push({ sensor, label: c.label, id: c.id });
    });
  });
  return blanks;
}

function getAllBlanks() {
  const result = [];
  STATIONS.forEach((s, i) => {
    const st = currentVisit.stations[i];
    const blanks = getStationBlanks(i);
    if (!st.stationDate) {
      result.push({ stIdx: i, site: s.site, loc: s.loc, unvisited: true, blanks: [] });
    } else if (blanks.length) {
      result.push({ stIdx: i, site: s.site, loc: s.loc, unvisited: false, blanks });
    }
  });
  return result;
}

// ── STATION ADVANCE ───────────────────────────────────────────────────────────
function advanceStation(idx) {
  const blanks = getStationBlanks(idx);
  const s = STATIONS[idx];

  const proceed = () => {
    const now = new Date();
    currentVisit.stations[idx].stationDate = now.toLocaleDateString('en-GB');
    currentVisit.stations[idx].stationTime = now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
    saveCheckpoint();
    if (idx < 7) {
      currentStationIdx = idx + 1;
      saveState();
      renderStationDots();
      renderStation(currentStationIdx);
      window.scrollTo(0,0);
    } else {
      currentStationIdx = idx;
      saveState();
      renderStationDots();
      renderStation(idx);
    }
  };

  if (!blanks.length) { proceed(); return; }

  const items = blanks.map(b => ({
    location: `${s.site} / ${s.loc} · ${b.sensor}`,
    detail: `"${b.label}" will be blank in the CSV`
  }));

  showAck(
    `${s.site}/${s.loc} — incomplete`,
    `${blanks.length} item(s) not logged. Acknowledge each to proceed.`,
    items, proceed
  );
}

// ── CHECKPOINT ────────────────────────────────────────────────────────────────
function saveCheckpoint() {
  const data = {
    version: 1,
    savedAt: new Date().toISOString(),
    operator: operatorName,
    currentStationIdx,
    currentVisit
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date().toLocaleDateString('en-GB').replace(/\//g,'-');
  a.download = `BOS_checkpoint_${d}_${operatorName.replace(/\s+/g,'_')}.json`;
  a.click();
}

function loadCheckpoint(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.currentVisit || !data.operator) throw new Error('Invalid checkpoint');
      currentVisit = data.currentVisit;
      currentStationIdx = data.currentStationIdx || 0;
      operatorName = data.operator;
      saveState();
      document.getElementById('operator-input').value = operatorName;
      const done = currentVisit.stations.filter(s => s.stationDate).length;
      document.getElementById('banner-detail').textContent =
        `${done}/8 stations completed · Restored from checkpoint · Operator: ${operatorName}`;
      document.getElementById('in-progress-banner').style.display = 'block';
      alert(`Checkpoint restored. ${done}/8 stations completed.`);
    } catch(err) {
      alert('Could not load checkpoint — file may be invalid.');
    }
  };
  reader.readAsText(file);
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function triggerExport() {
  // Auto-stamp current station if not yet stamped
  const st = currentVisit.stations[currentStationIdx];
  if (!st.stationDate) {
    const now = new Date();
    st.stationDate = now.toLocaleDateString('en-GB');
    st.stationTime = now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
  }

  const allBlanks = getAllBlanks();
  const proceed = () => exportCSV();

  if (!allBlanks.length) { proceed(); return; }

  const items = [];
  allBlanks.forEach(entry => {
    if (entry.unvisited) {
      items.push({
        location: `${entry.site} / ${entry.loc}`,
        detail: 'Station not visited — all fields will be blank'
      });
    } else {
      entry.blanks.forEach(b => {
        items.push({
          location: `${entry.site} / ${entry.loc} · ${b.sensor}`,
          detail: `"${b.label}" will be blank in the CSV`
        });
      });
    }
  });

  showAck('Pre-export review',
    `${items.length} blank item(s) across the visit. Acknowledge all to download CSV.`,
    items, proceed
  );
}

function exportCSV() {
  const now = new Date();
  const exportDate = now.toLocaleDateString('en-GB');
  const exportTime = now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});

  const allCheckIds = [];
  SENSOR_ORDER.forEach(sensor => {
    SENSOR_CHECKS[sensor].forEach(c => allCheckIds.push({ sensor, ...c }));
  });

  const header = [
    'export_date','export_time','operator',
    'station_date','station_time','site','location','lf_serial','hb_serial',
    ...allCheckIds.map(c => `${c.sensor.toLowerCase()}_${c.id}`),
    ...allCheckIds.map(c => `${c.sensor.toLowerCase()}_${c.id}_remark`)
  ];

  const rows = currentVisit.stations.map((st, i) => {
    const s = STATIONS[i];
    return [
      exportDate, exportTime, operatorName,
      st.stationDate || '', st.stationTime || '',
      s.site, s.loc, s.lf, s.hb,
      ...allCheckIds.map(c => st.checks[c.id] || ''),
      ...allCheckIds.map(c => st.checks[c.id + '_remark'] || '')
    ];
  });

  const csv = [header, ...rows]
    .map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(','))
    .join('\n');

  // Save to history
  visits.unshift({
    exportDate, exportTime,
    operator: operatorName,
    startDate: currentVisit.startDate,
    stations: currentVisit.stations.map((st, i) => ({...st, site: STATIONS[i].site, loc: STATIONS[i].loc}))
  });

  // Reset
  currentVisit = null;
  currentStationIdx = 0;
  saveState();

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  const fname = `BOS_${exportDate.replace(/\//g,'-')}_${operatorName.replace(/\s+/g,'_')}.csv`;
  a.download = fname;
  a.click();

  // Return to start screen
  document.getElementById('main-tabs').style.display = 'none';
  showView('start');
  document.getElementById('in-progress-banner').style.display = 'none';
}

// ── ACK ───────────────────────────────────────────────────────────────────────
function showAck(title, intro, items, onConfirm) {
  ackItems = items.map((item, i) => ({...item, acked: false, i}));
  ackCallback = onConfirm;
  document.getElementById('ack-title').textContent = title;
  document.getElementById('ack-intro').textContent = intro;
  renderAckItems();
  document.getElementById('ack-overlay').classList.add('open');
}

function renderAckItems() {
  document.getElementById('ack-items').innerHTML = ackItems.map((item, i) =>
    `<div class="ack-item${item.acked?' acknowledged':''}" onclick="toggleAck(${i})">
      <div class="ack-checkbox">${item.acked?'✓':''}</div>
      <div class="ack-text">
        <div class="ack-location">${item.location}</div>
        <div class="ack-detail">${item.detail}</div>
      </div>
    </div>`).join('');
  const allAcked = ackItems.every(x => x.acked);
  document.getElementById('ack-confirm-btn').classList.toggle('ready', allAcked);
}

function toggleAck(i) { ackItems[i].acked = !ackItems[i].acked; renderAckItems(); }

function confirmAck() {
  if (!ackItems.every(x => x.acked)) return;
  document.getElementById('ack-overlay').classList.remove('open');
  if (ackCallback) ackCallback();
}

function closeAck() { document.getElementById('ack-overlay').classList.remove('open'); }

// ── CONFIRM DIALOG ────────────────────────────────────────────────────────────
function showConfirm(title, msg, onConfirm) {
  confirmCallback = onConfirm;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-input').value = '';
  document.getElementById('confirm-ok-btn').classList.remove('ready');
  document.getElementById('confirm-overlay').classList.add('open');
}

function onConfirmInput() {
  const val = document.getElementById('confirm-input').value.trim().toUpperCase();
  document.getElementById('confirm-ok-btn').classList.toggle('ready', val === 'CONFIRM');
}

function doConfirm() {
  const val = document.getElementById('confirm-input').value.trim().toUpperCase();
  if (val !== 'CONFIRM') return;
  closeConfirm();
  if (confirmCallback) confirmCallback();
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
}

// ── TABS / VIEWS ──────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
}

function switchTab(t) {
  if (t === 'start') {
    document.getElementById('main-tabs').style.display = 'none';
    showView('start');
    return;
  }
  document.getElementById('main-tabs').style.display = 'flex';
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i===0 && t==='visit') || (i===1 && t==='history'));
  });
  showView(t);
  if (t === 'history') renderHistory();
}

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('history-list');
  const fSite = document.getElementById('filter-site').value;
  const fSensor = document.getElementById('filter-sensor').value;

  if (!visits.length) {
    list.innerHTML = '<div class="empty-state">No completed visits yet.</div>';
    return;
  }

  list.innerHTML = visits.map((v, vi) => {
    const visited = v.stations.filter(s => s.stationDate).length;
    const totalBlanks = v.stations.reduce((acc, st) => {
      SENSOR_ORDER.forEach(sensor => {
        SENSOR_CHECKS[sensor].forEach(c => { if (!st.checks[c.id]) acc++; });
      });
      return acc;
    }, 0);
    return `<div class="visit-card" onclick="showVisit(${vi})">
      <div class="visit-card-head">
        <div>
          <div class="visit-date">${v.exportDate} ${v.exportTime}</div>
          <div class="visit-operator">${v.operator}</div>
        </div>
        <div class="visit-flags">
          <span class="flag-chip ok">${visited}/8</span>
          ${totalBlanks ? `<span class="flag-chip blank">${totalBlanks} blank</span>` : ''}
        </div>
      </div>
      <div class="visit-stations">
        ${v.stations.map(st => {
          const hasBlanks = SENSOR_ORDER.some(sensor =>
            SENSOR_CHECKS[sensor].some(c => !st.checks[c.id])
          );
          const cls = !st.stationDate ? '' : hasBlanks ? 'flagged' : 'done';
          return `<span class="visit-station-chip ${cls}">${st.site.slice(-3)}/${st.loc}</span>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function showVisit(vi) {
  const v = visits[vi];
  const body = v.stations.map(st => {
    const rows = SENSOR_ORDER.map(sensor =>
      SENSOR_CHECKS[sensor].map(c => {
        const val = st.checks[c.id] || '';
        const rem = st.checks[c.id + '_remark'] || '';
        return `<div class="modal-check-row">
          <span class="modal-check-label">${sensor}: ${c.label}</span>
          <span class="modal-check-val ${val}">${val||'—'}${rem?' · '+rem:''}</span>
        </div>`;
      }).join('')
    ).join('');
    return `<div class="modal-station-block">
      <div class="modal-station-title">${st.site} / ${st.loc} ${st.stationDate ? '· '+st.stationDate+' '+st.stationTime : '(not visited)'}</div>
      ${rows}
    </div>`;
  }).join('');

  document.getElementById('modal-box').innerHTML = `
    <div class="modal-head">
      <h3>${v.exportDate} · ${v.operator}</h3>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body">${body}
      <button class="delete-btn" onclick="deleteVisit(${vi})">Delete record</button>
    </div>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) { if (e.target===document.getElementById('modal-overlay')) closeModalDirect(); }
function closeModalDirect() { document.getElementById('modal-overlay').classList.remove('open'); }

function deleteVisit(vi) {
  showConfirm('Delete record', 'Permanently delete this visit record?', () => {
    visits.splice(vi, 1);
    saveState();
    closeModalDirect();
    renderHistory();
  });
}

init();
</script>
</body>
</html>
